---
- name: Update and rebuild NixOS nodes
  hosts: nixos_nodes
  gather_facts: false

  vars:
    homelab_remote_repo: "/home/{{ ansible_user | default('ashpex') }}/homelab"
    homelab_repo_url: "https://github.com/Ashpex/homelab.git"
    homelab_repo_branch: "master"

  tasks:
    - name: Clone or update homelab repo
      ansible.builtin.raw: |
        set -eu

        repo={{ homelab_remote_repo | quote }}
        url={{ homelab_repo_url | quote }}
        branch={{ homelab_repo_branch | quote }}

        mkdir -p "$(dirname "$repo")"

        if [ -d "$repo/.git" ] && git -C "$repo" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          git -C "$repo" remote set-url origin "$url"
          git -C "$repo" fetch --prune origin "$branch"
          git -C "$repo" checkout -B "$branch" "origin/$branch"
          git -C "$repo" reset --hard "origin/$branch"
          git -C "$repo" clean -fdx
        else
          rm -rf "$repo"
          git clone --branch "$branch" "$url" "$repo"
        fi
      changed_when: true

    - name: Rebuild NixOS host
      ansible.builtin.raw: "nixos-rebuild switch --flake {{ homelab_remote_repo }}/nixos#{{ inventory_hostname }} --no-write-lock-file"
      become: true
      changed_when: true
