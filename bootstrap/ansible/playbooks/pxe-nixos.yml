---
- name: Fetch K3s join token from existing server
  hosts: metal0
  gather_facts: false
  become: true

  vars_prompt:
    - name: metal0_become_password
      prompt: "Sudo password for metal0"
      private: true

  vars:
    ansible_become_password: "{{ metal0_become_password }}"

  tasks:
    - name: Read K3s node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token_raw
      no_log: true

    - name: Expose K3s node token to PXE bootstrap play
      ansible.builtin.set_fact:
        k3s_node_token: "{{ k3s_node_token_raw.content | b64decode | trim }}"
      no_log: true

- name: Bootstrap local NixOS PXE server
  hosts: localhost
  connection: local
  gather_facts: true
  become: true

  vars_prompt:
    - name: local_become_password
      prompt: "Sudo password for local PXE desktop"
      private: true

  vars:
    ansible_become_password: "{{ local_become_password }}"
    pxe_root: /opt/homelab/pxe
    pxe_tftp_root: "{{ pxe_root }}/tftp"
    pxe_http_root: "{{ pxe_root }}/http"
    pxe_compose_root: "{{ pxe_root }}/compose"
    pxe_server_address: "{{ ansible_default_ipv4.address }}"
    pxe_http_port: 8082
    pxe_ipxe_url: https://boot.ipxe.org/ipxe.efi
    nixos_flake_dir: "{{ playbook_dir }}/../../../nixos"
    homelab_repo_dir: "{{ playbook_dir }}/../../.."
    pxe_install_hosts: "{{ groups['nixos_nodes'] | default([]) }}"
    pxe_install_base_url: "http://{{ pxe_server_address }}:{{ pxe_http_port }}"

  tasks:
    - name: Ensure PXE server is running on Linux
      ansible.builtin.assert:
        that:
          - ansible_system == "Linux"
        fail_msg: "PXE services must run on a Linux host with Docker host networking."

    - name: Ensure NixOS PXE inventory has at least one node
      ansible.builtin.assert:
        that:
          - pxe_install_hosts | length > 0
        fail_msg: "Add hosts under the nixos_nodes inventory group before running pxe-nixos."

    - name: Check NixOS host configurations exist
      ansible.builtin.stat:
        path: "{{ nixos_flake_dir }}/hosts/{{ item }}/configuration.nix"
      loop: "{{ pxe_install_hosts }}"
      register: nixos_host_config_stats
      become: false

    - name: Fail when a NixOS host configuration is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Missing nixos/hosts/{{ item.item }}/configuration.nix for inventory host {{ item.item }}."
      loop: "{{ nixos_host_config_stats.results }}"

    - name: Ensure Nix is available to build netboot artifacts
      ansible.builtin.command: nix --version
      changed_when: false

    - name: Build NixOS netboot artifacts from flake
      ansible.builtin.command:
        argv:
          - nix
          - build
          - "{{ nixos_flake_dir }}#netboot"
          - --out-link
          - /tmp/homelab-nixos-netboot
      environment:
        NIX_CONFIG: "experimental-features = nix-command flakes"
      changed_when: true
      become: false

    - name: Ensure PXE directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ pxe_tftp_root }}"
        - "{{ pxe_http_root }}"
        - "{{ pxe_http_root }}/boot"
        - "{{ pxe_compose_root }}"

    - name: Ensure per-host install directories exist
      ansible.builtin.file:
        path: "{{ pxe_http_root }}/install/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ pxe_install_hosts }}"

    - name: Build install repo tarball
      ansible.builtin.command:
        argv:
          - tar
          - --exclude=.git
          - --exclude=.env
          - --exclude=.vault_pass
          - --exclude=.vault_password
          - -C
          - "{{ homelab_repo_dir }}"
          - -cf
          - /tmp/homelab-pxe-repo.tar
          - .
      changed_when: true
      become: false

    - name: Install repo tarball for auto installer
      ansible.builtin.copy:
        src: /tmp/homelab-pxe-repo.tar
        dest: "{{ pxe_http_root }}/install/{{ item }}/repo.tar"
        mode: "0644"
        remote_src: true
      loop: "{{ pxe_install_hosts }}"

    - name: Install K3s token for auto installer
      ansible.builtin.copy:
        dest: "{{ pxe_http_root }}/install/{{ item }}/node-token"
        mode: "0644"
        content: "{{ hostvars['metal0'].k3s_node_token }}"
      no_log: true
      loop: "{{ pxe_install_hosts }}"

    - name: Download iPXE UEFI loader
      ansible.builtin.get_url:
        url: "{{ pxe_ipxe_url }}"
        dest: "{{ pxe_tftp_root }}/ipxe.efi"
        mode: "0644"

    - name: Install NixOS netboot kernel and initrd
      ansible.builtin.copy:
        src: "/tmp/homelab-nixos-netboot/{{ item }}"
        dest: "{{ pxe_http_root }}/{{ item }}"
        mode: "0644"
        remote_src: true
      loop:
        - bzImage
        - initrd

    - name: Install iPXE dispatcher script
      ansible.builtin.template:
        src: ../templates/pxe-boot.ipxe.j2
        dest: "{{ pxe_http_root }}/boot.ipxe"
        mode: "0644"

    - name: Install per-host iPXE boot scripts
      ansible.builtin.shell: |
        set -euo pipefail
        sed \
          -e "s|@@BASE_URL@@|{{ pxe_install_base_url }}|g" \
          -e "s|@@INSTALL_ARGS@@|homelab.install=1 homelab.host={{ item }} homelab.baseUrl={{ pxe_install_base_url }}|g" \
          /tmp/homelab-nixos-netboot/boot.ipxe > "{{ pxe_http_root }}/boot/{{ item }}.ipxe"
      args:
        executable: /bin/bash
      changed_when: true
      loop: "{{ pxe_install_hosts }}"

    - name: Install per-MAC iPXE boot script aliases
      ansible.builtin.copy:
        src: "{{ pxe_http_root }}/boot/{{ item }}.ipxe"
        dest: "{{ pxe_http_root }}/boot/{{ hostvars[item].pxe_mac | replace('-', ':') | lower }}.ipxe"
        mode: "0644"
        remote_src: true
      loop: "{{ pxe_install_hosts }}"
      when:
        - hostvars[item].pxe_mac is defined
        - hostvars[item].pxe_mac | length > 0

    - name: Write dnsmasq PXE config
      ansible.builtin.template:
        src: ../templates/pxe-dnsmasq.conf.j2
        dest: "{{ pxe_compose_root }}/dnsmasq.conf"
        mode: "0644"

    - name: Write PXE Docker Compose file
      ansible.builtin.template:
        src: ../templates/pxe-docker-compose.yml.j2
        dest: "{{ pxe_compose_root }}/docker-compose.yml"
        mode: "0644"

    - name: Write PXE nginx config
      ansible.builtin.template:
        src: ../templates/pxe-nginx.conf.j2
        dest: "{{ pxe_compose_root }}/nginx.conf"
        mode: "0644"

    - name: Start PXE services
      community.docker.docker_compose_v2:
        project_src: "{{ pxe_compose_root }}"
        state: present
        pull: always
