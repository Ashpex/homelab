apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actualbudget-oidc
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    name: actualbudget-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACTUALBUDGET_CLIENT_SECRET
      remoteRef:
        key: oidc.clients
        property: ACTUALBUDGET_CLIENT_SECRET
