app-template:
  fullnameOverride: actualbudget
  controllers:
    main:
      containers:
        main:
          image:
            repository: actualbudget/actual-server
            tag: latest
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          env:
          - name: TZ
            value: Asia/Ho_Chi_Minh
          - name: ACTUAL_OPENID_DISCOVERY_URL
            value: https://auth.ashpex.net/.well-known/openid-configuration
          - name: ACTUAL_OPENID_CLIENT_ID
            value: actualbudget
          - name: ACTUAL_OPENID_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: actualbudget-oidc
                key: ACTUALBUDGET_CLIENT_SECRET
          - name: ACTUAL_OPENID_SERVER_HOSTNAME
            value: https://budget.ashpex.net
          - name: ACTUAL_OPENID_ENFORCE
            value: "true"
          ports:
          - name: http
            containerPort: 5006
  service:
    main:
      enabled: true
      controller: main
      type: ClusterIP
      ports:
        http:
          enabled: true
          primary: true
          port: 5006
          protocol: HTTP
  ingress:
    main:
      enabled: true
      className: traefik
      annotations: {}
      hosts:
      - host: budget.ashpex.net
        paths:
        - path: "/"
          pathType: Prefix
          service:
            identifier: main
            port: http
  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        main:
          main:
          - path: "/data"
