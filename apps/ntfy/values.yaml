app-template:
  fullnameOverride: ntfy
  controllers:
    main:
      pod:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: ["metal1"]
      containers:
        main:
          image:
            repository: binwiederhier/ntfy
            tag: latest
          args:
          - serve
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          env:
          - name: TZ
            value: Asia/Ho_Chi_Minh
          - name: NTFY_BASE_URL
            value: https://notify.ashpex.net
          - name: NTFY_BEHIND_PROXY
            value: "true"
          ports:
          - name: http
            containerPort: 80
  service:
    main:
      enabled: true
      controller: main
      type: ClusterIP
      ports:
        http:
          enabled: true
          primary: true
          port: 80
          protocol: HTTP
  ingress:
    main:
      enabled: true
      className: traefik
      annotations: {}
      hosts:
      - host: notify.ashpex.net
        paths:
        - path: "/"
          pathType: Prefix
          service:
            identifier: main
            port: http
  persistence:
    main-data:
      enabled: true
      type: persistentVolumeClaim
      annotations:
        helm.sh/resource-policy: keep
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 100Mi
      advancedMounts:
        main:
          main:
          - path: "/etc/ntfy"
            subPath: data
          - path: "/var/cache/ntfy"
            subPath: cache
