app-template:
  fullnameOverride: copyparty
  controllers:
    main:
      containers:
        main:
          image:
            repository: copyparty/ac
            tag: latest
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: "/"
                  port: http
                initialDelaySeconds: 30
                periodSeconds: 60
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: "/"
                  port: http
                initialDelaySeconds: 15
                periodSeconds: 60
            startup:
              enabled: false
          ports:
          - name: http
            containerPort: 3923
      pod:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: homelab.node/nas
                      operator: DoesNotExist
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
  service:
    main:
      enabled: true
      controller: main
      type: ClusterIP
      ports:
        http:
          enabled: true
          primary: true
          port: 3923
          protocol: HTTP
  ingress:
    main:
      enabled: true
      className: traefik
      annotations: {}
      hosts:
      - host: files.ashpex.net
        paths:
        - path: "/"
          pathType: Prefix
          service:
            identifier: main
            port: http
  persistence:
    main-config:
      enabled: true
      type: secret
      name: copyparty-config
      advancedMounts:
        main:
          main:
          - path: "/cfg/copyparty.conf"
            subPath: config
            readOnly: true
    main-share:
      enabled: true
      type: custom
      volumeSpec:
        nfs:
          server: "192.168.1.110"
          path: /mnt/ssd0
      advancedMounts:
        main:
          main:
          - path: "/w"
