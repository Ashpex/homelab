branding:
  custom-footer: |
    <p>Powered by 100% capitalism income.</p>
  logo-text: A
  logo-url: https://ashpex.net/favicon.svg
  favicon-url: https://ashpex.net/favicon.svg
theme:
  background-color: 0 0 16
  primary-color: 43 59 81
  positive-color: 61 66 44
  negative-color: 6 96 59
pages:
  - name: Start
    #width: slim
    hide-desktop-navigation: false 
    center-vertically: true
    columns:
      - size: full
        widgets:
          - type: search
            autofocus: true

          - type: monitor
            cache: 1m
            title: Services
            sites:
              - title: Navidrome
                url: https://music.ashpex.net/
                check-url: http://navidrome.navidrome.svc.cluster.local:4533/
                icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/navidrome.svg
              - title: Transmission
                url: https://torrent.ashpex.net/
                check-url: http://transmission.transmission.svc.cluster.local:9091/
                icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons@master/svg/transmission.svg
              - title: Immich
                url: https://photos.ashpex.net/
                check-url: http://immich-server.immich.svc.cluster.local:2283/
                icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/immich.svg
              - title: Calibre Web
                url: https://library.ashpex.net/
                check-url: http://calibre-web.calibre-web.svc.cluster.local:8083/
                icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/calibre-web.svg

              - title: AdGuard Home
                url: https://adguard.ashpex.net/
                check-url: http://adguard.adguard.svc.cluster.local/
                icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/adguard-home.svg
              - title: Frigate
                url: https://nvr.ashpex.net/
                check-url: http://frigate.frigate.svc.cluster.local:8971/
                icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/frigate-light.svg
              - title: Forgejo
                url: https://git.ashpex.net/
                check-url: http://forgejo-http.forgejo.svc.cluster.local:3000/
                icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/forgejo.svg
              - title: ntfy
                url: https://notify.ashpex.net/
                check-url: http://ntfy.ntfy.svc.cluster.local:80/
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/ntfy.svg
              - title: Authelia
                url: https://auth.ashpex.net/
                check-url: http://authelia.authelia.svc.cluster.local/
                icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/authelia.svg
              - title: Traefik
                url: https://traefik.ashpex.net/
                check-url: http://traefik-dashboard.traefik.svc.cluster.local:8080/ping
                icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/traefik.svg
              - title: CopyParty
                url: https://files.ashpex.net/
                check-url: http://copyparty.copyparty.svc.cluster.local:3923/
                icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/copyparty.svg
              - title: RomM
                url: https://romm.ashpex.net/
                check-url: http://romm-main.romm.svc.cluster.local:8080/api/heartbeat
                icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/romm.svg
              - title: Backrest
                url: https://backrest.ashpex.net/
                check-url: http://backrest.backrest.svc.cluster.local:9898/
                icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/backrest-light.svg
              - title: Actual Budget
                url: https://budget.ashpex.net/
                check-url: http://actualbudget.actualbudget.svc.cluster.local:5006/
                icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/actual-budget.svg

          - type: bookmarks
            groups:
              - title: Quick Links
                links:
                  - title: GitHub Repo
                    url: https://github.com/Ashpex/homelab
                  - title: Forgejo Repo
                    url: https://git.ashpex.net/ashpex/homelab
                  - title: Tangled Repo
                    url: https://tangled.org/ashpex.net/homelab
                  - title: Gmail
                    url: https://mail.google.com/
                  - title: OMG! Ubuntu
                    url: https://www.omgubuntu.co.uk/
                  - title: Cloudflare
                    url: https://dash.cloudflare.com/
                  - title: Tailscale
                    url: https://login.tailscale.com/admin/machines

      - size: small
        widgets:
          - type: server-stats
            servers:
              - type: local
                name: metal0
                hide-mountpoints-by-default: true
                mountpoints:
                  "/":
                    name: Root
                    hide: false
                  "/mnt/ssd0":
                    name: SSD0
                    hide: false
              - type: remote
                name: metal1
                url: http://glance-agent-metal1.glance.svc.cluster.local:27973
                timeout: 5s
                hide-mountpoints-by-default: true
                mountpoints:
                  "/etc/hosts":
                    name: Root
                    hide: false
              - type: remote
                name: metal2
                url: http://glance-agent-metal2.glance.svc.cluster.local:27973
                timeout: 5s
                hide-mountpoints-by-default: true
                mountpoints:
                  "/etc/hosts":
                    name: Root
                    hide: false

          - type: custom-api
            cache: 30s
            title: Kubernetes Nodes
            url: https://kubernetes.default.svc/api/v1/nodes
            allow-insecure: true
            headers:
              Authorization: Bearer ${readFileFromEnv:KUBE_TOKEN_FILE}
            template: |
              <div class="flex flex-column gap-10">
                {{ range .JSON.Array "items" }}
                  {{ $ready := .String "status.conditions.#(type==\"Ready\").status" }}
                  <div class="flex justify-between">
                    <span>{{ .String "metadata.name" }}</span>
                    {{ if eq $ready "True" }}
                      <span class="color-positive">Ready</span>
                    {{ else }}
                      <span class="color-negative">{{ if $ready }}{{ $ready }}{{ else }}Unknown{{ end }}</span>
                    {{ end }}
                  </div>
                {{ end }}
              </div>

          - type: monitor
            cache: 30s
            title: Storage
            sites:
              - title: Longhorn UI
                url: http://longhorn-frontend.longhorn-system.svc.cluster.local/
                check-url: http://longhorn-frontend.longhorn-system.svc.cluster.local/
                timeout: 5s
                icon: si:longhorn

          - type: dns-stats
            service: adguard
            url: http://adguard.adguard.svc.cluster.local/
            username: ${ADGUARD_USERNAME}
            password: ${ADGUARD_PASSWORD}


  - name: Home
    columns:
      - size: small
        widgets:
          - type: rss
            limit: 10
            collapse-after: 3
            cache: 1h
            feeds:
              - url: https://feeds.arstechnica.com/arstechnica/index
                title: arstechnica
              - url: https://www.joshwcomeau.com/rss.xml
                title: Josh Comeau
              - url: https://samwho.dev/rss.xml
              - url: https://awesomekling.github.io/feed.xml
              - url: https://ishadeed.com/feed.xml
                title: Ahmad Shadeed

          - type: releases
            show-source-icon: true
            repositories:
            - navidrome/navidrome
            - glanceapp/glance
            - immich-app/immich
            - AdguardTeam/AdGuardHome
            - restic/restic
            - rommapp/romm
            - blakeblackshear/frigate
            - binwiederhier/ntfy
            - actualbudget/actual


      - size: full
        widgets:
          - type: group
            widgets:
              - type: reddit
                show-thumbnails: true
                show-flairs: true
                subreddit: homelab
              - type: reddit
                show-thumbnails: true
                show-flairs: true
                subreddit: selfhosted

          - type: group
            widgets:
              - type: hacker-news
              - type: lobsters
                sort-by: hot
                tags:
                  - go
                  - security
                  - linux
                  - android
                  - privacy

          - type: videos
            collapse-after-rows: 2
            channels:
              - UCi8C7TNs2ohrc6hnRQ5Sn2w # Kai Lentit
              - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
              - UCjSEJkpGbcZhvo0lr-44X_w # techhut
              - UCVS6ejD9NLZvjsvhcbiDzjw # Crosstalk Solutions

      - size: small
        widgets:
          - type: weather
            location: Ho Chi Minh City, Vietnam

          - type: calendar

          - type: releases
            show-source-icon: true
            repositories:
            - navidrome/navidrome
            - glanceapp/glance
            - immich-app/immich
            - AdguardTeam/AdGuardHome
            - restic/restic
            - rommapp/romm
            - blakeblackshear/frigate
            - binwiederhier/ntfy
            - actualbudget/actual


  - name: Gaming
    columns:
      - size: small
        widgets:
          - type: custom-api
            title: Steam User
            cache: 1h
            url: https://api.steampowered.com/ISteamUser/GetPlayerSummaries/v0002/?key=${STEAM_API_KEY}&steamids=76561198382644086
            template: |
              <div class="steam-user-stats" style="display: flex; align-items: flex-start;">
                {{ $players := .JSON.Array "response.players" }}
                {{ if gt (len $players) 0 }}
                  {{ $player := index $players 0 }}
                  <div style="flex-shrink: 0; margin-right: 1em; display: flex; flex-direction: column; align-items: center;">
                    <a href="{{ $player.String "profileurl" }}"><img src="{{ $player.String "avatarmedium" }}" alt="Avatar" style="border-radius: var(--border-radius);"></a>
                  </div>
                  <div>
                    <h2 class="size-h3 color-primary">{{ $player.String "personaname" }}</h2>
                    <p>Status:
                      {{ $status := $player.Int "personastate" }}
                      {{ if eq $status 0 }}<span class="color-negative">Offline</span>{{ end }}
                      {{ if eq $status 1 }}<span class="color-positive">Online</span>{{ end }}
                      {{ if eq $status 2 }}<span class="color-highlight">Busy</span>{{ end }}
                      {{ if eq $status 3 }}<span class="color-subdue">Away</span>{{ end }}
                      {{ if eq $status 4 }}<span class="color-subdue">Snooze</span>{{ end }}
                      {{ if eq $status 5 }}<span class="color-primary">Looking to trade</span>{{ end }}
                      {{ if eq $status 6 }}<span class="color-primary">Looking to play</span>{{ end }}
                    </p>
                    {{ $game := $player.String "gameextrainfo" }}
                    {{ if $game }}
                    <p>Playing: <span class="color-positive"><a href="https://store.steampowered.com/app/{{ $player.String "gameid" }}" target="_blank" class="color-positive">{{ $game }}</a></span></p>
                    {{ end }}
                    <p>Last Logoff: <span class="color-subdue" data-dynamic-relative-time="{{ $player.Int "lastlogoff" }}"></span></p>
                    <p>Account Created: <span class="color-subdue" data-dynamic-relative-time="{{ $player.Int "timecreated" }}"></span></p>
                    <p>Country: <span class="color-subdue">{{ $player.String "loccountrycode" }}</span></p>
                  </div>
                {{ else }}
                  <p class="color-negative">No player data found.</p>
                {{ end }}
              </div>

          - type: custom-api
            title: Recently Played Games
            cache: 1h
            url: http://api.steampowered.com/IPlayerService/GetRecentlyPlayedGames/v0001/?key=${STEAM_API_KEY}&steamid=76561198382644086&format=json
            template: |
              <div>
                {{ if eq .Response.StatusCode 200 }}
                  {{ $games := .JSON.Array "response.games" }}
                  {{ if gt (len $games) 0 }}
                    <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                      {{ range $games }}
                        <li style="display: flex; align-items: center;">
                          <a href="https://store.steampowered.com/app/{{ .Int "appid" }}" target="_blank">
                            <img
                              src="http://media.steampowered.com/steamcommunity/public/images/apps/{{ .Int "appid" }}/{{ .String "img_icon_url" }}.jpg"
                              alt="{{ .String "name" }}"
                              style="width: 32px; border-radius: var(--border-radius); margin-right: 10px;">
                          </a>
                          <div>
                            <a
                              href="https://store.steampowered.com/app/{{ .Int "appid" }}"
                              class="size-base color-primary"
                              target="_blank"
                            >
                              {{ .String "name" }}
                            </a>
                            <br>
                            <span class="size-h5 color-subdue">
                              Last 2 weeks:
                              {{ if gt (toFloat (.Int "playtime_2weeks")) 60.0 }}
                                {{ printf "%.2f hrs" (div (toFloat (.Int "playtime_2weeks")) 60.0) }}
                              {{ else }}
                                {{ .Int "playtime_2weeks" }} mins
                              {{ end }}
                            </span>
                          </div>
                        </li>
                      {{ end }}
                    </ul>
                  {{ else }}
                    <p class="color-negative">No recently played games found.</p>
                  {{ end }}
                {{ else }}
                  <p class="color-negative">An unexpected error occurred. Please try again later.</p>
                {{ end }}
              </div>

          - type: custom-api
            title: Steam Specials
            cache: 12h
            url: https://store.steampowered.com/api/featuredcategories?cc=vn
            template: |
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
              {{ range .JSON.Array "specials.items" }}
                {{ $header := .String "header_image" }}
                {{ $urlPrefix := "https://store.steampowered.com/sub/" }}
                {{ if findMatch "/steam/apps/" $header }}
                  {{ $urlPrefix = "https://store.steampowered.com/app/" }}
                {{ end }}
                <li style="display: flex; align-items: center; gap: 0.75rem;">
                  <img src="{{ .String "small_capsule_image" }}" alt="{{ .String "name" }}" style="width: 60px; border-radius: var(--border-radius); flex-shrink: 0;">
                  <div style="min-width: 0;">
                    <a class="size-h4 color-highlight block text-truncate" href="{{ $urlPrefix }}{{ .Int "id" }}/">{{ .String "name" }}</a>
                    <ul class="list-horizontal-text">
                      <li>{{ .Int "final_price" | toFloat | mul 0.00001 | printf "₫%.0f,000" }}</li>
                      {{ $discount := .Int "discount_percent" }}
                      <li{{ if ge $discount 40 }} class="color-positive"{{ end }}>{{ $discount }}% off</li>
                    </ul>
                  </div>
                </li>
              {{ end }}
              </ul>

      - size: full
        widgets:
          - type: group
            widgets:
              - type: reddit
                show-thumbnails: true
                subreddit: pcgaming
              - type: reddit
                subreddit: games

          - type: videos
            style: grid-cards
            collapse-after-rows: 2
            channels:
              - UCZ7AeeVbyslLM_8-nVy2B8Q # Skill Up
              - UCHDxYLv8iovIbhrfl16CNyg # GameLinked
              - UC9PBzalIcEQCsiIkq36PyUA # Digital Foundry

      - size: small
        widgets:
          - type: custom-api
            title: Epic Games
            cache: 1h
            url: https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=en&country=US&allowCountries=US
            template: |
              <div>
                {{ if eq .Response.StatusCode 200 }}
                  <div class="horizontal-cards-2">
                    {{ range .JSON.Array "data.Catalog.searchStore.elements" }}
                      {{ $price := .String "price.totalPrice.discountPrice" }}
                      {{ $hasPromo := gt (len (.Array "promotions.promotionalOffers")) 0 }}
                      {{ if and $hasPromo (eq $price "0") }}
                        {{ $gamePage := .String "productSlug" }}
                        {{ if gt (len (.Array "offerMappings")) 0 }}
                          {{ $gamePage = .String "offerMappings.0.pageSlug" }}
                        {{end }}
                        <a href="https://store.epicgames.com/en-US/p/{{ $gamePage }}" target="_blank" class="card">
                          {{ $title := .String "title" }}
                          {{ range .Array "keyImages" }}
                            {{ if eq (.String "type") "OfferImageWide" }}
                              <img src="{{ .String "url" }}" alt="{{ $title }}" style="width: 100%; max-width: 300px; height: 150px; object-fit: cover; border-radius: var(--border-radius);">
                            {{ end }}
                          {{ end }}
                          <div class="card-content">
                            <span class="size-base color-primary">{{ $title }}</span><br>
                            <span class="size-h5 color-subdue">
                              {{ if $hasPromo }}
                                {{ $promotions := .Array "promotions.promotionalOffers" }}
                                {{ if gt (len $promotions) 0 }}
                                  {{ $firstPromo := index $promotions 0 }}
                                  {{ $offers := $firstPromo.Array "promotionalOffers" }}
                                  {{ if gt (len $offers) 0 }}
                                    {{ $firstOffer := index $offers 0 }}
                                    Free until {{ slice ($firstOffer.String "endDate") 0 10 }}
                                  {{ else }}
                                    Free this week!
                                  {{ end }}
                                {{ else }}
                                  Free this week!
                                {{ end }}
                              {{ end }}
                            </span>
                          </div>
                        </a>
                      {{ end }}
                    {{ end }}
                  </div>
                {{ else }}
                  <p class="color-negative">Error fetching Epic Games data.</p>
                {{ end }}
              </div>

          - type: twitch-top-games
            limit: 20
            collapse-after: 5
            exclude:
              - just-chatting
              - pools-hot-tubs-and-beaches
              - music
              - art
              - asmr
