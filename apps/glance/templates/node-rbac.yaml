apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glance-node-reader
  labels:
    app.kubernetes.io/name: glance
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["longhorn.io"]
    resources: ["backuptargets", "backupvolumes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glance-node-reader
  labels:
    app.kubernetes.io/name: glance
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: glance-node-reader
subjects:
  - kind: ServiceAccount
    name: glance
    namespace: {{ .Release.Namespace }}
