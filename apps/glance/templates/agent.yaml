{{- $nodes := list
  (dict "name" "metal1" "hostname" "metal1")
  (dict "name" "metal2" "hostname" "metal2")
-}}
{{- range $node := $nodes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance-agent-{{ $node.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: glance-agent
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: agent
    homelab.node/name: {{ $node.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glance-agent
      app.kubernetes.io/instance: {{ $.Release.Name }}
      homelab.node/name: {{ $node.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glance-agent
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: agent
        homelab.node/name: {{ $node.name }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ $node.hostname }}
      containers:
        - name: agent
          image: glanceapp/agent:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Ho_Chi_Minh
          ports:
            - name: http
              containerPort: 27973
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: glance-agent-{{ $node.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: glance-agent
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: agent
    homelab.node/name: {{ $node.name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: glance-agent
    app.kubernetes.io/instance: {{ $.Release.Name }}
    homelab.node/name: {{ $node.name }}
  ports:
    - name: http
      port: 27973
      targetPort: http
      protocol: TCP
{{- end }}
