<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f13;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .container { max-width: 420px; padding: 2rem; }
    h1 {
      font-size: 7rem;
      font-weight: 800;
      color: #4a9eff;
      line-height: 1;
      letter-spacing: -4px;
    }
    h2 {
      font-size: 1.2rem;
      font-weight: 400;
      margin-top: 0.75rem;
      color: #888;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    p { margin-top: 2rem; color: #555; font-size: 0.9rem; }
    a { color: #4a9eff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you're looking for doesn't exist.<br><br><a href="/">Go home</a></p>
  </div>
</body>
</html>
