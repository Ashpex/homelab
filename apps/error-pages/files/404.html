<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-weight: bold;
      background: #050f05;
      color: #00ff41;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: min(560px, 100% - 3rem);
      padding: 2rem 0;
    }

    .glyph {
      margin-bottom: 36px;
      opacity: 0.7;
      width: clamp(48px, 10vw, 72px);
      height: auto;
      display: block;
    }

    .lines {
      font-size: clamp(0.72rem, 2.5vw, 0.9rem);
      line-height: 2;
      width: 100%;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .line { opacity: 0; }
    .line.dim  { color: #2d5a2d; }
    .line.main { color: #00ff41; }
    .line.blue { color: #00ff41; }
    .line.resp { color: #2d5a2d; opacity: 1; }
    .line.link a {
      color: #00ff41;
      text-decoration: none;
      border-bottom: 1px solid #0a3a0a;
    }
    .line.link a:hover { border-bottom-color: #00ff41; }

    .prompt-line {
      display: flex;
      align-items: center;
      opacity: 0;
      font-size: clamp(0.72rem, 2.5vw, 0.9rem);
      line-height: 2;
      width: 100%;
    }
    .prompt-line.visible { opacity: 1; }
    .prompt-sym { margin-right: 4px; flex-shrink: 0; }
    .prompt-input {
      background: transparent;
      border: none;
      outline: none;
      color: #00ff41;
      font-family: inherit;
      font-size: inherit;
      caret-color: #00ff41;
      width: 100%;
      min-width: 0;
    }

    .visible { opacity: 1; }

    @keyframes blink { 50% { opacity: 0; } 0%, 100% { opacity: 1; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="content">
    <svg class="glyph" width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="70" height="70" stroke="#0a3a0a" stroke-width="1"/>
      <rect x="10" y="10" width="52" height="52" stroke="#0a3a0a" stroke-width="0.5"/>
      <line x1="1" y1="1" x2="10" y2="10" stroke="#00ff41" stroke-width="0.5"/>
      <line x1="71" y1="1" x2="62" y2="10" stroke="#00ff41" stroke-width="0.5"/>
      <line x1="1" y1="71" x2="10" y2="62" stroke="#00ff41" stroke-width="0.5"/>
      <line x1="71" y1="71" x2="62" y2="62" stroke="#00ff41" stroke-width="0.5"/>
      <circle cx="36" cy="36" r="8" stroke="#00ff41" stroke-width="1" fill="none"/>
      <circle cx="36" cy="36" r="2" fill="#00ff41"/>
      <line x1="36" y1="10" x2="36" y2="28" stroke="#0a3a0a" stroke-width="0.5"/>
      <line x1="36" y1="44" x2="36" y2="62" stroke="#0a3a0a" stroke-width="0.5"/>
      <line x1="10" y1="36" x2="28" y2="36" stroke="#0a3a0a" stroke-width="0.5"/>
      <line x1="44" y1="36" x2="62" y2="36" stroke="#0a3a0a" stroke-width="0.5"/>
    </svg>

    <div class="lines" id="lines">
      <div class="line main" data-delay="0">&gt; ROUTE NOT FOUND</div>
      <div class="line dim"  data-delay="400">&gt; scanning /404...</div>
      <div class="line main" data-delay="900">&gt; 0 results</div>
      <div class="line dim"  data-delay="1500">[ ... ] this page doesn't exist or you don't have permission to view it</div>
      <div class="line blue" data-delay="2200">[ &bull; ] where do you want to go?</div>
      <div class="line link" data-delay="2900">&gt; <a href="https://ashpex.net">~/home</a></div>
    </div>

    <div class="prompt-line" id="prompt">
      <span class="prompt-sym">&gt;</span>
      <input class="prompt-input" id="input" type="text" autocomplete="off" spellcheck="false" autofocus />
    </div>
  </div>

  <script>
    // particles
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W, H, dots = [];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function initDots() {
      dots = Array.from({length: 80}, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        a: Math.random(),
        s: (Math.random() - 0.5) * 0.002
      }));
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      dots.forEach(d => {
        d.a += d.s;
        if (d.a < 0.1 || d.a > 1) d.s *= -1;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0,255,65,${d.a * 0.3})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }

    resize();
    initDots();
    draw();
    window.addEventListener('resize', () => { resize(); initDots(); });

    // typewriter reveal
    document.querySelectorAll('.line[data-delay]').forEach(el => {
      setTimeout(() => el.classList.add('visible'), +el.dataset.delay);
    });
    const prompt = document.getElementById('prompt');
    const isTouchDevice = window.matchMedia('(hover: none)').matches;
    setTimeout(() => {
      prompt.classList.add('visible');
      if (!isTouchDevice) document.getElementById('input').focus();
    }, 3400);

    // commands
    const commands = {
      help:   '[ available ] clear, date, help, whoami, home',
      whoami: 'unknown — access denied',
      date:   () => new Date().toString(),
      home:   () => { window.location.href = 'https://ashpex.net'; return 'redirecting...'; },
      clear:  '__clear__',
    };

    const linesEl = document.getElementById('lines');
    const input   = document.getElementById('input');

    function addLine(text, cls = 'resp') {
      const d = document.createElement('div');
      d.className = `line ${cls}`;
      d.style.opacity = '1';
      d.textContent = text;
      linesEl.appendChild(d);
    }

    input.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const raw  = input.value.trim();
      const cmd  = raw.split(' ')[0].toLowerCase();
      const args = raw.slice(cmd.length).trim();
      input.value = '';

      if (!raw) return;

      addLine('> ' + raw, 'main');

      const handler = commands[cmd];
      if (!handler) {
        addLine(`command not found: ${cmd}`);
      } else if (handler === '__clear__') {
        linesEl.innerHTML = '';
      } else {
        const out = typeof handler === 'function' ? handler(args) : handler;
        if (out) addLine(out);
      }
    });

    // keep input focused on click anywhere (desktop only)
    if (!isTouchDevice) document.addEventListener('click', () => input.focus());
  </script>
</body>
</html>
