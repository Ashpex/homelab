<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Not Found</title>
  <style>
    :root {
      --bg: #e7eee4;
      --fg: #14241d;
      --muted: #5c6f65;
      --line: #c9d7cc;
      --accent: #2f7d66;
      --cat: #d99a5f;
      --cat-dark: #14241d;
      --cat-cream: #f1cfad;
      --box: #b98b5c;
      --box-dark: #8b6540;
      --box-light: #d5ad7c;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        var(--bg);
      background-size: 48px 48px;
      color: var(--fg);
    }

    main {
      text-align: center;
      padding: 2rem 1.5rem;
      width: min(620px, calc(100% - 3rem));
    }

    .cat {
      width: min(24rem, 82vw);
      height: auto;
      margin: 0 auto 0.25rem;
      display: block;
      overflow: visible;
    }

    .cat-line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cat-line {
      stroke: var(--cat-dark);
      stroke-width: 4;
    }

    .cat-fur { fill: var(--cat); }
    .cat-inner { fill: var(--cat-cream); }
    .cat-dark { fill: var(--cat-dark); }
    .cat-accent { fill: var(--accent); }
    .box-fill { fill: var(--box); }
    .box-light { fill: var(--box-light); }
    .box-line {
      fill: none;
      stroke: var(--cat-dark);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cat-eye {
      fill: var(--cat-dark);
    }

    .cat-float {
      animation: float 3s ease-in-out infinite;
      transform-origin: 100px 100px;
    }

    .cat-ear-left {
      animation: left-ear 4s ease-in-out infinite;
      transform-origin: 67px 44px;
    }

    .cat-ear-right {
      animation: right-ear 4s ease-in-out infinite;
      transform-origin: 153px 44px;
    }

    .cat-eye {
      animation: blink 4.5s infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    h1 {
      margin: 0.25rem 0 0;
      font-size: clamp(4.75rem, 16vw, 8.5rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0;
    }

    p {
      margin: 1rem auto 0;
      max-width: 34rem;
      font-size: clamp(1rem, 2vw, 1.1rem);
      line-height: 1.6;
      color: var(--muted);
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      margin-top: 1.75rem;
      padding: 0 1.15rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--fg);
      text-decoration: none;
      background: color-mix(in srgb, var(--bg) 86%, white);
    }

    a:focus-visible,
    a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.12); }
    }

    @keyframes left-ear {
      0%, 88%, 100% { transform: rotate(0); }
      92% { transform: rotate(-5deg); }
    }

    @keyframes right-ear {
      0%, 88%, 100% { transform: rotate(0); }
      92% { transform: rotate(5deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cat-float,
      .cat-ear-left,
      .cat-ear-right,
      .cat-eye {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <svg class="cat" viewBox="0 0 220 172" role="img" aria-label="Animated cat in a cardboard box">
      <g class="cat-float">
        <path class="cat-fur cat-ear-left" d="M36 103C39 72 45 25 62 18c13-5 35 33 48 53" />
        <path class="cat-fur cat-ear-right" d="M184 103c-3-31-9-78-26-85-13-5-35 33-48 53" />
        <path class="cat-line cat-ear-left" d="M36 103C39 72 45 25 62 18c13-5 35 33 48 53" />
        <path class="cat-line cat-ear-right" d="M184 103c-3-31-9-78-26-85-13-5-35 33-48 53" />
        <path class="cat-inner" d="M58 82c4-21 8-37 15-41 7 3 17 18 25 32z" />
        <path class="cat-inner" d="M162 82c-4-21-8-37-15-41-7 3-17 18-25 32z" />
        <path class="cat-fur" d="M35 132V98c0-43 28-72 75-72s75 29 75 72v34z" />
        <path class="cat-line" d="M35 132V98c0-43 28-72 75-72s75 29 75 72v34" />
        <path class="cat-line" d="M94 50v8M104 48v10M114 48v10M124 50v8M99 70v9M109 68v10M119 70v9" />
        <circle class="cat-eye" cx="81" cy="101" r="11" />
        <circle class="cat-eye" cx="139" cy="101" r="11" />
        <path class="cat-line" d="M110 117c2 12 16 12 20 0M110 117c-2 12-16 12-20 0" />
        <path class="cat-line" d="M28 94l-22-4M29 109 6 113M192 94l22-4M191 109l23 4" />
      </g>
      <path class="box-light" d="M20 127h180l-18 22H38z" />
      <path class="box-fill" d="M38 147h144v20H38z" />
      <path class="box-light" d="M20 127 5 146h33l18-19zM200 127l15 19h-33l-18-19z" />
      <path class="box-line" d="M20 127h180M38 147h144M38 147v20M182 147v20M38 167h144M20 127 5 146h33l18-19M200 127l15 19h-33l-18-19" />
    </svg>
    <h1>404</h1>
    <p>The page you are trying to reach either does not exist, has been removed or you are not authorized to view it.</p>
    <a href="https://ashpex.net">Go home</a>
  </main>
</body>
</html>
