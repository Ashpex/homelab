<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Courier New', monospace;
      background: #0d1117;
      color: #c9d1d9;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .terminal {
      width: 560px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }
    .titlebar {
      background: #21262d;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #30363d;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red    { background: #ff5f57; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green  { background: #28c840; }
    .title { margin-left: 8px; font-size: 0.75rem; color: #8b949e; }
    .body { padding: 24px 28px; font-size: 0.875rem; line-height: 1.8; }
    .prompt { color: #58a6ff; }
    .cmd { color: #c9d1d9; }
    .err { color: #f85149; }
    .comment { color: #8b949e; }
    .hint { color: #3fb950; }
    .blank { height: 1rem; }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="titlebar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <span class="title">bash — 80×24</span>
    </div>
    <div class="body">
      <div><span class="prompt">~</span> <span class="cmd">GET <span style="color:#e3b341">/</span></span></div>
      <div class="blank"></div>
      <div><span class="err">error[404]:</span> page not found</div>
      <div><span class="comment">   ──── this page doesn't exist or you don't have permission to view it</span></div>
      <div class="blank"></div>
      <div><span class="hint">hint:</span> <span class="comment">try going <a href="/" style="color:#58a6ff;text-decoration:none">home</a> instead</span></div>
    </div>
  </div>
</body>
</html>
