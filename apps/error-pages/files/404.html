<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Not Found</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f5f0;
      --fg: #1f2523;
      --muted: #6d746f;
      --line: #d9d3c7;
      --accent: #246b5b;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111816;
        --fg: #eef4ef;
        --muted: #a1aaa4;
        --line: #2a3732;
        --accent: #8bd7bf;
      }
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        var(--bg);
      background-size: 48px 48px;
      color: var(--fg);
    }

    main {
      text-align: center;
      padding: 2rem;
      width: min(520px, calc(100% - 3rem));
    }

    .cat {
      position: relative;
      width: 9rem;
      height: 7rem;
      margin: 0 auto 1.5rem;
      animation: float 3s ease-in-out infinite;
    }

    .cat::before,
    .cat::after {
      content: "";
      position: absolute;
      top: 0.2rem;
      width: 3rem;
      height: 3rem;
      background: var(--fg);
      transform: rotate(45deg);
      border-radius: 0.35rem;
    }

    .cat::before {
      left: 1.2rem;
      animation: left-ear 4s ease-in-out infinite;
    }

    .cat::after {
      right: 1.2rem;
      animation: right-ear 4s ease-in-out infinite;
    }

    .tail {
      position: absolute;
      right: -1.4rem;
      bottom: 0.7rem;
      width: 3.4rem;
      height: 3.4rem;
      border: 0.45rem solid var(--fg);
      border-left-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50%;
      transform-origin: 0.7rem 2.7rem;
      animation: tail 2.4s ease-in-out infinite;
    }

    .face {
      position: absolute;
      inset: 1rem 0 0;
      border: 3px solid var(--fg);
      border-radius: 48% 48% 42% 42%;
      background: var(--bg);
    }

    .eye {
      position: absolute;
      top: 2.7rem;
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 999px;
      background: var(--accent);
      animation: blink 4.5s infinite;
    }

    .eye.left { left: 3rem; }
    .eye.right { right: 3rem; }

    .nose {
      position: absolute;
      top: 4rem;
      left: 50%;
      width: 0.6rem;
      height: 0.45rem;
      border-radius: 999px;
      background: var(--fg);
      transform: translateX(-50%);
    }

    .whisker {
      position: absolute;
      top: 4.35rem;
      width: 2.1rem;
      height: 2px;
      background: var(--line);
    }

    .whisker.left { left: 1.2rem; transform: rotate(8deg); }
    .whisker.right { right: 1.2rem; transform: rotate(-8deg); }

    h1 {
      margin: 0;
      font-size: clamp(5rem, 22vw, 11rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0;
    }

    p {
      margin: 1.25rem auto 0;
      max-width: 28rem;
      font-size: clamp(1rem, 2.5vw, 1.125rem);
      line-height: 1.6;
      color: var(--muted);
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      margin-top: 2rem;
      padding: 0 1.15rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--fg);
      text-decoration: none;
      background: color-mix(in srgb, var(--bg) 88%, white);
    }

    a:focus-visible,
    a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-0.35rem); }
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.12); }
    }

    @keyframes tail {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(10deg); }
    }

    @keyframes left-ear {
      0%, 88%, 100% { transform: rotate(45deg); }
      92% { transform: rotate(35deg); }
    }

    @keyframes right-ear {
      0%, 88%, 100% { transform: rotate(45deg); }
      92% { transform: rotate(55deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cat,
      .cat::before,
      .cat::after,
      .tail,
      .eye {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="cat" aria-hidden="true">
      <span class="tail"></span>
      <div class="face">
        <span class="eye left"></span>
        <span class="eye right"></span>
        <span class="nose"></span>
        <span class="whisker left"></span>
        <span class="whisker right"></span>
      </div>
    </div>
    <h1>404</h1>
    <p>The page you are trying to reach either does not exist, has been removed or you are not authorized to view it.</p>
    <a href="https://ashpex.net">Go home</a>
  </main>
</body>
</html>
