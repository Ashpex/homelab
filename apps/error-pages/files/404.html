<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Not Found</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f5f0;
      --fg: #1f2523;
      --muted: #6d746f;
      --line: #d9d3c7;
      --accent: #246b5b;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111816;
        --fg: #eef4ef;
        --muted: #a1aaa4;
        --line: #2a3732;
        --accent: #8bd7bf;
      }
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        var(--bg);
      background-size: 48px 48px;
      color: var(--fg);
    }

    main {
      text-align: center;
      padding: 2rem;
      width: min(520px, calc(100% - 3rem));
    }

    .cat {
      width: min(13rem, 58vw);
      height: auto;
      margin: 0 auto 1.5rem;
      display: block;
      overflow: visible;
    }

    .cat-body {
      fill: var(--bg);
      stroke: var(--fg);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cat-line {
      fill: none;
      stroke: var(--fg);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cat-eye,
    .cat-nose {
      fill: var(--accent);
    }

    .cat-float {
      animation: float 3s ease-in-out infinite;
      transform-origin: 100px 100px;
    }

    .cat-tail {
      animation: tail 2.4s ease-in-out infinite;
      transform-origin: 148px 123px;
    }

    .cat-left-ear {
      animation: left-ear 4s ease-in-out infinite;
      transform-origin: 67px 57px;
    }

    .cat-right-ear {
      animation: right-ear 4s ease-in-out infinite;
      transform-origin: 133px 57px;
    }

    .cat-eye {
      animation: blink 4.5s infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(5rem, 22vw, 11rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0;
    }

    p {
      margin: 1.25rem auto 0;
      max-width: 28rem;
      font-size: clamp(1rem, 2.5vw, 1.125rem);
      line-height: 1.6;
      color: var(--muted);
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      margin-top: 2rem;
      padding: 0 1.15rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--fg);
      text-decoration: none;
      background: color-mix(in srgb, var(--bg) 88%, white);
    }

    a:focus-visible,
    a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.12); }
    }

    @keyframes tail {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(9deg); }
    }

    @keyframes left-ear {
      0%, 88%, 100% { transform: rotate(0); }
      92% { transform: rotate(-8deg); }
    }

    @keyframes right-ear {
      0%, 88%, 100% { transform: rotate(0); }
      92% { transform: rotate(8deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cat-float,
      .cat-tail,
      .cat-left-ear,
      .cat-right-ear,
      .cat-eye {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <svg class="cat" viewBox="0 0 200 160" role="img" aria-label="Animated cat">
      <g class="cat-float">
        <path class="cat-line cat-tail" d="M145 118c31-6 35-44 9-51-17-4-26 9-21 21" />
        <path class="cat-body cat-left-ear" d="M59 64 72 32l22 27" />
        <path class="cat-body cat-right-ear" d="M106 59 128 32l13 32" />
        <path class="cat-body" d="M52 73c0-28 21-47 48-47s48 19 48 47v19c0 29-21 48-48 48s-48-19-48-48z" />
        <circle class="cat-eye" cx="82" cy="84" r="6" />
        <circle class="cat-eye" cx="118" cy="84" r="6" />
        <path class="cat-nose" d="M95 102c0-3 10-3 10 0 0 4-3 7-5 7s-5-3-5-7z" />
        <path class="cat-line" d="M100 109v8" />
        <path class="cat-line" d="M66 103h20M64 115h22M134 103h-20M136 115h-22" />
      </g>
    </svg>
    <h1>404</h1>
    <p>The page you are trying to reach either does not exist, has been removed or you are not authorized to view it.</p>
    <a href="https://ashpex.net">Go home</a>
  </main>
</body>
</html>
