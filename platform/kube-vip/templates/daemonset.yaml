apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kube-vip
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip
    spec:
      serviceAccountName: kube-vip
      hostNetwork: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
              - matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: Exists
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      containers:
        - name: kube-vip
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          args:
            - manager
          env:
            - name: vip_arp
              value: "true"
            - name: port
              value: "{{ .Values.vip.port }}"
            - name: vip_subnet
              value: "{{ .Values.vip.subnet }}"
            - name: cp_enable
              value: "true"
            - name: cp_namespace
              value: {{ .Release.Namespace | quote }}
            - name: svc_enable
              value: "true"
            - name: svc_election
              value: "false"
            - name: vip_leaderelection
              value: "true"
            - name: vip_leaseduration
              value: {{ .Values.leaderElection.leaseDuration | quote }}
            - name: vip_renewdeadline
              value: {{ .Values.leaderElection.renewDeadline | quote }}
            - name: vip_retryperiod
              value: {{ .Values.leaderElection.retryPeriod | quote }}
            - name: vip_ddns
              value: "false"
            - name: address
              value: {{ .Values.vip.address | quote }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_TIME
