apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-glance-longhorn-backend
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: glance
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: glance-glance
              app.kubernetes.io/name: glance-glance
      ports:
        - protocol: TCP
          port: 9500
